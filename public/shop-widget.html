<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ShieldHub</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #212121;
    --surface: #2f2f2f;
    --surface-hover: #3a3a3a;
    --surface-raised: #383838;
    --border: rgba(255,255,255,0.08);
    --border-strong: rgba(255,255,255,0.14);
    --text: #ececec;
    --text-secondary: #b4b4b4;
    --text-muted: #8e8e8e;
    --accent: #10a37f;
    --accent-hover: #0e8f6f;
    --accent-subtle: rgba(16,163,127,0.12);
    --accent-blue: #5b9bf5;
    --accent-blue-subtle: rgba(91,155,245,0.12);
    --amber: #e5a50a;
    --amber-subtle: rgba(229,165,10,0.12);
    --red: #ef4444;
    --red-subtle: rgba(239,68,68,0.12);
    --radius: 12px;
    --radius-sm: 8px;
    --radius-xs: 6px;
    --shadow: 0 0 0 1px var(--border);
    --transition: 0.15s ease;
  }
  body {
    font-family: "Söhne", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, Cantarell, "Noto Sans", sans-serif;
    color: var(--text);
    background:
      radial-gradient(120% 90% at 0% 0%, rgba(16,163,127,0.2) 0%, rgba(16,163,127,0) 45%),
      radial-gradient(100% 80% at 100% 0%, rgba(91,155,245,0.14) 0%, rgba(91,155,245,0) 42%),
      var(--bg);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .app { max-width: 100%; min-height: 0; }

  .header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px; border-bottom: 1px solid var(--border);
  }
  .header-logo {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--accent); display: flex; align-items: center;
    justify-content: center; flex-shrink: 0; color: #fff;
  }
  .header-logo svg { width: 20px; height: 20px; }
  .header-text h1 { font-size: 15px; font-weight: 600; color: var(--text); }
  .header-text p { font-size: 12px; color: var(--text-muted); }

  .global-nav {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 6px;
    padding: 10px 16px 2px;
  }
  .nav-btn {
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text-secondary);
    font-size: 11px;
    font-weight: 600;
    padding: 8px 6px;
    cursor: pointer;
    transition: all var(--transition);
  }
  .nav-btn:hover { border-color: var(--border-strong); color: var(--text); }
  .nav-btn.active {
    color: var(--text);
    border-color: rgba(16,163,127,0.45);
    background: linear-gradient(180deg, rgba(16,163,127,0.2), rgba(16,163,127,0.08));
  }

  .hero-card {
    margin: 12px 16px 0;
    border-radius: var(--radius);
    border: 1px solid rgba(16,163,127,0.35);
    background: linear-gradient(160deg, rgba(16,163,127,0.23), rgba(16,163,127,0.04) 60%, rgba(91,155,245,0.08) 100%);
    padding: 14px;
  }
  .hero-kicker {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #96e4ce;
    font-weight: 700;
  }
  .hero-title { margin-top: 4px; font-size: 17px; line-height: 1.25; font-weight: 700; }
  .hero-desc { margin-top: 6px; font-size: 12px; color: var(--text-secondary); }
  .hero-actions { margin-top: 12px; display: flex; gap: 8px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 14px; border-radius: var(--radius-xs); font-size: 13px;
    font-weight: 500; border: none; cursor: pointer; transition: all var(--transition);
    text-decoration: none; line-height: 1.4;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary {
    background: rgba(0,0,0,0.22);
    color: var(--text);
    border: 1px solid var(--border-strong);
  }
  .btn-secondary:hover { background: rgba(0,0,0,0.3); }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn-block { width: 100%; }

  .filters {
    display: flex; gap: 6px; padding: 10px 16px; overflow-x: auto;
    -webkit-overflow-scrolling: touch; scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .filter-chip {
    padding: 5px 12px; border-radius: 16px; font-size: 12px; font-weight: 500;
    border: 1px solid var(--border-strong); background: transparent; color: var(--text-secondary);
    cursor: pointer; white-space: nowrap; transition: all var(--transition);
  }
  .filter-chip:hover { background: var(--surface-hover); color: var(--text); }
  .filter-chip.active {
    background: var(--text); color: var(--bg); border-color: var(--text);
  }

  /* ─── Plan cards (no images) ─────────────────────────────────────────────── */
  .plan-grid {
    display: grid; grid-template-columns: 1fr; gap: 10px; padding: 12px 16px;
  }
  @media (min-width: 480px) { .plan-grid { grid-template-columns: 1fr 1fr; } }

  .plan-card {
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); transition: all var(--transition);
    position: relative; overflow: hidden;
  }
  .plan-card:hover { border-color: var(--border-strong); background: var(--surface-hover); }
  .plan-card.popular { border-color: var(--accent); }

  .plan-card-header {
    padding: 14px 14px 10px;
    display: flex; align-items: flex-start; gap: 10px;
  }
  .plan-icon {
    width: 40px; height: 40px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .plan-icon svg { width: 20px; height: 20px; }
  .plan-icon.basic { background: var(--surface-raised); color: var(--text-secondary); }
  .plan-icon.standard { background: var(--accent-blue-subtle); color: var(--accent-blue); }
  .plan-icon.premium { background: var(--amber-subtle); color: var(--amber); }

  .plan-header-text { flex: 1; min-width: 0; }
  .plan-name { font-size: 14px; font-weight: 600; }
  .plan-price {
    font-size: 13px; font-weight: 600; color: var(--accent);
    margin-top: 1px;
  }
  .plan-price span { font-weight: 400; color: var(--text-muted); font-size: 12px; }

  .plan-badges {
    display: flex; gap: 6px; position: absolute; top: 12px; right: 12px;
  }
  .badge {
    padding: 2px 8px; border-radius: 6px;
    font-size: 10px; font-weight: 600; letter-spacing: 0.02em;
  }
  .badge-popular { background: var(--accent-subtle); color: var(--accent); }
  .badge-tier { background: var(--surface-raised); color: var(--text-muted); }
  .badge-tier.standard { background: var(--accent-blue-subtle); color: var(--accent-blue); }
  .badge-tier.premium { background: var(--amber-subtle); color: var(--amber); }

  .plan-card-body { padding: 0 14px 14px; }
  .plan-desc { font-size: 12px; color: var(--text-secondary); margin-bottom: 8px; line-height: 1.4; }

  .coverage-list { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
  .coverage-tag {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 2px 8px; border-radius: 6px;
    font-size: 10px; font-weight: 500;
    background: var(--accent-subtle); color: var(--accent);
  }
  .coverage-tag svg { width: 10px; height: 10px; }
  .coverage-tag.more { background: var(--surface-raised); color: var(--text-muted); }

  .plan-meta {
    display: flex; align-items: center; gap: 10px;
    font-size: 11px; color: var(--text-muted); margin-bottom: 10px;
  }
  .plan-meta strong { color: var(--accent); font-weight: 600; }

  .plan-footer {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 2px;
  }
  .device-icons { display: flex; gap: 3px; font-size: 13px; }
  .rating { display: inline-flex; align-items: center; gap: 3px; font-size: 11px; color: var(--text-muted); }
  .rating svg { width: 12px; height: 12px; color: var(--amber); }

  /* ─── Promotions carousel ────────────────────────────────────────────────── */
  .carousel-wrapper { position: relative; padding: 12px 0; }
  .carousel-track {
    display: flex; gap: 10px; overflow-x: auto; padding: 0 16px;
    scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .carousel-track::-webkit-scrollbar { display: none; }

  .promo-card {
    flex: 0 0 240px; scroll-snap-align: start;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); position: relative; overflow: hidden;
  }
  .promo-card-header {
    padding: 16px 14px; display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid var(--border);
  }
  .promo-icon {
    width: 36px; height: 36px; border-radius: 8px;
    background: var(--accent-subtle); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .promo-icon svg { width: 18px; height: 18px; }
  .promo-badge-wrap { position: absolute; top: 10px; right: 10px; }
  .promo-badge {
    padding: 2px 8px; border-radius: 6px;
    font-size: 10px; font-weight: 600;
    background: var(--accent); color: #fff;
  }
  .promo-card-body { padding: 12px 14px 14px; }
  .promo-name { font-size: 14px; font-weight: 600; }
  .promo-desc { font-size: 12px; color: var(--text-secondary); margin-top: 4px; line-height: 1.4; }
  .promo-pricing { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .promo-price { font-size: 16px; font-weight: 700; color: var(--accent); }
  .promo-price span { font-size: 11px; font-weight: 400; color: var(--text-muted); }
  .promo-original { font-size: 13px; color: var(--text-muted); text-decoration: line-through; }

  .carousel-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 30px; height: 30px; border-radius: 50%; background: var(--surface-raised);
    border: 1px solid var(--border-strong); cursor: pointer; display: flex;
    align-items: center; justify-content: center;
    z-index: 5; transition: all var(--transition); color: var(--text-secondary);
  }
  .carousel-nav:hover { background: var(--surface-hover); color: var(--text); }
  .carousel-nav svg { width: 16px; height: 16px; }
  .carousel-nav.prev { left: 6px; }
  .carousel-nav.next { right: 6px; }

  /* ─── Repair centers ─────────────────────────────────────────────────────── */
  .centers-section { padding: 12px 16px; }
  .center-map-placeholder {
    width: 100%; height: 160px; border-radius: var(--radius);
    background: linear-gradient(135deg, #1a2a2a 0%, #1a2530 50%, #1e2330 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    margin-bottom: 12px; position: relative; overflow: hidden;
  }
  .map-grid {
    position: absolute; inset: 0; opacity: 0.08;
    background-image:
      linear-gradient(rgba(255,255,255,0.15) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.15) 1px, transparent 1px);
    background-size: 30px 30px;
  }
  .map-pin {
    width: 24px; height: 24px; background: var(--accent); border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg); position: relative; z-index: 2;
    box-shadow: 0 2px 10px rgba(16,163,127,0.5);
  }
  .map-pin::after {
    content: ""; position: absolute; top: 5px; left: 5px;
    width: 14px; height: 14px; background: var(--bg); border-radius: 50%;
  }
  .map-label { margin-top: 10px; font-size: 12px; color: var(--text-muted); z-index: 2; }

  .center-list { display: flex; flex-direction: column; gap: 6px; }
  .center-card {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 12px; border: 1px solid var(--border);
    border-radius: var(--radius-sm); transition: all var(--transition);
    cursor: pointer;
  }
  .center-card:hover { border-color: var(--accent); background: rgba(16,163,127,0.04); }
  .center-icon {
    width: 36px; height: 36px; border-radius: 8px; background: var(--accent-subtle);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; color: var(--accent);
  }
  .center-icon svg { width: 16px; height: 16px; }
  .center-info { flex: 1; min-width: 0; }
  .center-name { font-size: 13px; font-weight: 600; }
  .center-detail { font-size: 11px; color: var(--text-muted); }
  .center-services { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 5px; }
  .service-tag {
    padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 500;
    background: var(--surface-raised); color: var(--text-secondary);
  }
  .center-meta { text-align: right; flex-shrink: 0; }
  .center-rating { font-size: 12px; font-weight: 600; color: var(--text); }
  .center-rating svg { width: 12px; height: 12px; color: var(--amber); }
  .center-turnaround { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
  .certified-badge {
    display: inline-flex; align-items: center; gap: 2px;
    font-size: 10px; font-weight: 600; color: var(--accent); margin-top: 2px;
  }
  .certified-badge svg { width: 10px; height: 10px; }

  /* ─── Cart ───────────────────────────────────────────────────────────────── */
  .cart-section { padding: 12px 16px; }
  .cart-empty {
    text-align: center; padding: 36px 16px; color: var(--text-muted); font-size: 13px;
  }
  .cart-empty-icon { margin-bottom: 10px; color: var(--text-muted); }
  .cart-empty-icon svg { width: 36px; height: 36px; }

  .cart-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  .cart-item:last-child { border-bottom: none; }
  .cart-item-icon {
    width: 40px; height: 40px; border-radius: var(--radius-sm);
    background: var(--accent-subtle); display: flex; align-items: center;
    justify-content: center; flex-shrink: 0; color: var(--accent);
  }
  .cart-item-icon svg { width: 18px; height: 18px; }
  .cart-item-info { flex: 1; min-width: 0; }
  .cart-item-name { font-size: 13px; font-weight: 600; }
  .cart-item-desc { font-size: 11px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cart-item-qty { display: flex; align-items: center; gap: 8px; }
  .qty-btn {
    width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--border-strong);
    background: transparent; cursor: pointer; display: flex;
    align-items: center; justify-content: center; color: var(--text-secondary);
    transition: all var(--transition);
  }
  .qty-btn svg { width: 14px; height: 14px; }
  .qty-btn:hover { background: var(--surface-hover); color: var(--text); }
  .qty-num { font-size: 13px; font-weight: 600; min-width: 16px; text-align: center; }
  .cart-item-price { font-size: 13px; font-weight: 600; color: var(--accent); margin-left: 10px; white-space: nowrap; }
  .cart-item-price span { font-size: 10px; font-weight: 400; color: var(--text-muted); }

  .cart-summary {
    margin-top: 14px; padding: 14px; background: var(--surface);
    border-radius: var(--radius-sm); border: 1px solid var(--border);
  }
  .cart-summary-row {
    display: flex; justify-content: space-between;
    font-size: 12px; padding: 3px 0; color: var(--text-muted);
  }
  .cart-summary-row.total {
    font-size: 14px; font-weight: 700; color: var(--text);
    border-top: 1px solid var(--border); margin-top: 8px; padding-top: 10px;
  }

  /* ─── Confirmation ───────────────────────────────────────────────────────── */
  .confirmation { padding: 24px 16px; text-align: center; }
  .confirm-icon {
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--accent-subtle); display: flex;
    align-items: center; justify-content: center;
    margin: 0 auto 14px; color: var(--accent);
  }
  .confirm-icon svg { width: 28px; height: 28px; }
  .confirm-title { font-size: 18px; font-weight: 700; }
  .confirm-policy-id { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .confirm-coverage {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 12px; padding: 6px 14px; background: var(--accent-subtle);
    border-radius: 16px; font-size: 12px; font-weight: 600; color: var(--accent);
  }
  .confirm-coverage svg { width: 14px; height: 14px; }
  .confirm-items {
    margin-top: 18px; text-align: left;
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    overflow: hidden;
  }
  .confirm-items-header {
    padding: 8px 12px; background: var(--surface);
    font-size: 11px; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .confirm-item {
    display: flex; justify-content: space-between; padding: 8px 12px;
    font-size: 13px; border-top: 1px solid var(--border);
  }

  .error-view {
    padding: 36px 16px; text-align: center;
    color: var(--red); font-size: 13px;
  }

  .loading {
    display: flex; align-items: center; justify-content: center;
    padding: 60px 16px; color: var(--text-muted); font-size: 13px;
  }
  .loading-dot {
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
    margin: 0 3px; animation: bounce 1.4s infinite ease-in-out both;
  }
  .loading-dot:nth-child(1) { animation-delay: -0.32s; }
  .loading-dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-in { animation: fadeIn 0.25s ease forwards; }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .slide-up { animation: slideUp 0.35s ease forwards; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading">
    <div class="loading-dot"></div>
    <div class="loading-dot"></div>
    <div class="loading-dot"></div>
  </div>
</div>

<script>
let rpcId = 0;
const pendingRequests = new Map();
let bridgeReadyResolve = null;
const bridgeReady = new Promise((resolve) => { bridgeReadyResolve = resolve; });
const isStandalone = window.parent === window;

const rpcRequest = (method, params) =>
  new Promise((resolve, reject) => {
    const id = ++rpcId;
    pendingRequests.set(id, { resolve, reject });
    window.parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
  });

const rpcNotify = (method, params) =>
  window.parent.postMessage({ jsonrpc: "2.0", method, params }, "*");

function escapeHtml(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#39;");
}

function deepSanitize(value) {
  if (typeof value === "string") return escapeHtml(value);
  if (Array.isArray(value)) return value.map((item) => deepSanitize(item));
  if (value && typeof value === "object") {
    return Object.fromEntries(Object.entries(value).map(([key, item]) => [key, deepSanitize(item)]));
  }
  return value;
}

function saveWidgetState(data) {
  if (!window.openai || typeof window.openai.setWidgetState !== "function") return;
  const state = { lastData: data };
  Promise.resolve(window.openai.setWidgetState(state)).catch(() => {});
}

function restoreWidgetState() {
  const restored = window.openai?.widgetState?.lastData;
  if (!restored) return false;
  render(restored, { persist: false });
  return true;
}

function notifyHostLayout() {
  if (!window.openai) return;
  const candidates = [
    window.openai.notifyIntrinsicHeight,
    window.openai.notifyIntrinsicSize,
    window.openai.setFrameHeight,
  ].filter((fn) => typeof fn === "function");
  if (candidates.length === 0) return;
  requestAnimationFrame(() => {
    for (const fn of candidates) {
      try {
        fn.call(window.openai);
      } catch {
        // Ignore host bridge differences across clients.
      }
    }
  });
  setTimeout(() => {
    for (const fn of candidates) {
      try {
        fn.call(window.openai);
      } catch {
        // Ignore host bridge differences across clients.
      }
    }
  }, 60);
}

async function initializeBridge() {
  if (window.openai?.callTool || isStandalone) {
    bridgeReadyResolve();
    return;
  }

  try {
    await rpcRequest("ui/initialize", {
      appInfo: { name: "shieldhub", version: "1.0.0" },
      appCapabilities: {},
      protocolVersion: "2026-01-26",
    });
    rpcNotify("ui/notifications/initialized", {});
  } catch (e) {
    console.error("Bridge init failed:", e);
  } finally {
    bridgeReadyResolve();
  }
}

async function callTool(name, args = {}) {
  await bridgeReady;

  if (window.openai?.callTool) {
    const response = await window.openai.callTool(name, args);
    if (response?.structuredContent) {
      render(response.structuredContent);
    }
    return response;
  }

  if (isStandalone) {
    throw new Error("Tool bridge unavailable outside ChatGPT.");
  }

  const response = await rpcRequest("tools/call", { name, arguments: args });
  if (response?.structuredContent) {
    render(response.structuredContent);
  }
  return response;
}

window.addEventListener("message", (event) => {
  if (event.source !== window.parent) return;
  const msg = event.data;
  if (!msg || msg.jsonrpc !== "2.0") return;
  if (msg.id && pendingRequests.has(msg.id)) {
    const { resolve, reject } = pendingRequests.get(msg.id);
    pendingRequests.delete(msg.id);
    if (msg.error) reject(msg.error);
    else resolve(msg.result);
    return;
  }
  if (msg.method === "ui/notifications/tool-result") {

const app = document.getElementById("app");

function renderGlobalNav(active) {
  const tabs = [
    { id: "plans", label: "Plans", tool: "browse_plans", args: { filter: "all" } },
    { id: "promotions", label: "Deals", tool: "view_promotions", args: {} },
    { id: "centers", label: "Repairs", tool: "find_repair_centers", args: {} },
    { id: "cart", label: "Cart", tool: "view_cart", args: {} },
  ];
  return `
    <div class="global-nav">
      ${tabs.map((tab) => `
        <button class="nav-btn ${tab.id === active ? "active" : ""}" data-nav-tool="${tab.tool}" data-nav-args='${JSON.stringify(tab.args)}'>
          ${tab.label}
        </button>
      `).join("")}
    </div>
  `;
}

function bindGlobalNav() {
  app.querySelectorAll("[data-nav-tool]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const args = JSON.parse(btn.dataset.navArgs || "{}");
      callTool(btn.dataset.navTool, args).catch((err) => {
        console.error("Nav action failed:", err);
      });
    });
  });
}

function render(data, options = {}) {
  const safeData = deepSanitize(data || {});
  const { persist = true } = options;
  const { view } = safeData;

  switch (view) {
    case "plans": renderPlans(safeData); break;
    case "promotions": renderPromotions(safeData); break;
    case "centers": renderCenters(safeData); break;
    case "cart": renderCart(safeData); break;
    case "confirmation": renderConfirmation(safeData); break;
    case "error": renderError(safeData); break;
    default: renderError({ message: "Unknown view" });
  }

  bindGlobalNav();
  notifyHostLayout();

  if (persist) {
    saveWidgetState(safeData);
  }
}

        <p>Preview mode</p>

    </div>

      <div class="hero-title">Open this widget inside ChatGPT to run tools.</div>
      <div class="hero-desc">Local standalone mode can render the UI shell, but tool calls require the ChatGPT Apps bridge.</div>
    </div>
  `;
}

async function bootstrap() {
  await initializeBridge();

  if (restoreWidgetState()) return;

  if (isStandalone && !window.openai?.callTool) {
    renderStandaloneState();
    return;
  }

  try {
    await callTool("browse_plans", { filter: "all" });
  } catch (err) {
    console.error("Initial browse_plans call failed:", err);
    renderError({ message: "Unable to load plans right now. Ask ChatGPT to run Browse Protection Plans." });
  }
}

bootstrap();
